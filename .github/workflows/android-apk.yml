name: Drogaria Online Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'config.js'
      - 'firebase-config.js'
      - 'apps-script/**'
      - 'capacitor.config.json'
      - 'www/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Validate frontend and backend sources
        run: node scripts/validate-app.mjs
      - name: Prepare native app icon and splash
        run: |
          python -m pip install --quiet Pillow
          mkdir -p assets www
          cp config.js www/config.js
          cp firebase-config.js www/firebase-config.js
          cp icon-512.png assets/icon.png
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (2732, 2732), "#edf6f1")
          icon = Image.open("icon-512.png").convert("RGBA")
          icon.thumbnail((1000, 1000))
          im.paste(icon, ((2732-icon.width)//2, (2732-icon.height)//2), icon)
          im.save("assets/splash.png")
          PY
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#087e68' --splashBackgroundColor '#edf6f1'
          npx cap sync android
          chmod +x android/gradlew
      - name: Set Android version for future updates
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()
          version_code = int(os.environ["VERSION_CODE"])
          if version_code < 1:
              raise SystemExit("VERSION_CODE precisa ser maior que zero")

          content, code_count = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              lambda match: f"{match.group(1)}versionCode {version_code}",
              content,
              count=1,
          )
          content, name_count = re.subn(
              r"""(?m)^(\s*)versionName\s+(['"])[^'"]*\2\s*$""",
              lambda match: f'{match.group(1)}versionName "1.0.{version_code}"',
              content,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  f"Nao foi possivel definir a versao Android (versionCode={code_count}, versionName={name_count})"
              )
          path.write_text(content)
          print(f"Versao Android configurada: versionCode={version_code}, versionName=1.0.{version_code}")
          PY
      - name: Configure release signing (when secrets are available)
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/drogaria-release.jks
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("drogaria-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Nao foi encontrado o bloco buildTypes em android/app/build.gradle")
          if "signingConfigs {" not in s:
              s = s.replace(marker, signing + "\n" + marker, 1)
          start = s.find(marker)
          before, after = s[:start], s[start:]
          if "signingConfig signingConfigs.release" not in after:
              after = after.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(before + after)
          PY
      - name: Build test APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Drogaria-Online-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drogaria-Online-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
