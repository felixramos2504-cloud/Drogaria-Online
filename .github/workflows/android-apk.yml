name: Drogaria Online Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare native app icon and splash
        run: |
          python -m pip install --quiet Pillow
          mkdir -p assets
          cp icon-512.png assets/icon.png
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (2732, 2732), "#edf6f1")
          icon = Image.open("icon-512.png").convert("RGBA")
          icon.thumbnail((1000, 1000))
          im.paste(icon, ((2732-icon.width)//2, (2732-icon.height)//2), icon)
          im.save("assets/splash.png")
          PY
      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#087e68' --splashBackgroundColor '#edf6f1'
          npx cap sync android
          chmod +x android/gradlew
      - name: Build test APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drogaria-Online-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
