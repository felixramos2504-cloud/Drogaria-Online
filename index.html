<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087e68"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Drogaria Online"><title>Drogaria Online</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#edf6f1;color:#123e35;font:16px system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border-radius:24px;padding:32px 24px;max-width:450px;width:100%;box-shadow:0 12px 40px #064d3920;text-align:center}.logo{width:100px;height:100px;border-radius:24px}h1{margin:16px 0 2px;font-size:28px}p{color:#536f66;line-height:1.5}.btn{display:block;width:100%;padding:16px 20px;margin:12px 0;border:none;border-radius:12px;background:#087e68;color:white;font:700 16px system-ui;cursor:pointer}.secondary{background:#e4f2ed;color:#105447}.muted{font-size:13px}.warn{display:none;background:#fff4e3;color:#7c5110;padding:12px;border-radius:10px;text-align:left;font-size:14px}</style></head><body><main class="card"><img class="logo" src="./icons/icon-192.png" alt="Símbolo da Drogaria Online"><h1>Drogaria Online</h1><p>Seu cuidado mais perto de você.</p><button class="btn" id="open">Abrir Drogaria</button><button class="btn secondary" id="install" hidden>Instalar aplicativo</button><p class="warn" id="warn">Configure a URL do aplicativo no arquivo config.js antes de publicar.</p><p class="muted">Vitrine, carrinho e pedidos continuam no sistema seguro do Google Apps Script. É necessária conexão com a internet.</p></main><script src="./config.js"></script><script>const u=window.DROGARIA_APP_URL||'';const ready=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\/?$/.test(u);document.getElementById('warn').style.display=ready?'none':'block';document.getElementById('open').onclick=()=>{if(!ready){document.getElementById('warn').style.display='block';return;}window.location.assign(u)};if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});let pending=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;document.getElementById('install').hidden=false});document.getElementById('install').onclick=async()=>{if(!pending)return;pending.prompt();await pending.userChoice;pending=null;document.getElementById('install').hidden=true};window.addEventListener('appinstalled',()=>{document.getElementById('install').hidden=true});</script></body></html>
